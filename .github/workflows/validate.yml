name: Validate public hub data
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cloudflare/test/*.test.mjs
      - run: node --check cloudflare/src/index.mjs
      - run: node --test backup/test/*.test.mjs
      - run: node --check backup/src/index.mjs
      - run: node --check backup/src/helpers.mjs
