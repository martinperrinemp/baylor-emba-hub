# Independent, owner-only backup health monitor. NO public URL or routes.
name = "baylor-emba-backup-watchdog"
main = "src/index.mjs"
compatibility_date = "2026-10-10"
workers_dev = false
preview_urls = false

# Daily owner-only backup check at 12:00 UTC, three hours after backup.
# 07:00 CDT / 06:00 CST, with no public HTTP routes.
[triggers]
crons = ["0 12 * * *"]

[vars]
WATCHDOG_TEST_MODE = "false"

# Persist Cron invocation logs across GitHub deployments (not dashboard-only).
# Low-volume, owner-only Worker: capture 100% of executions and failures.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

[[r2_buckets]]
binding = "PRIVATE_BACKUPS"
bucket_name = "baylor-emba-private-backups"
