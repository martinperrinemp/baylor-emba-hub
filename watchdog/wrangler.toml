# Independent, owner-only backup health monitor. NO public URL or routes.
name = "baylor-emba-backup-watchdog"
main = "src/index.mjs"
compatibility_date = "2026-10-10"
workers_dev = false
preview_urls = false

# TEMPORARY Discord delivery smoke test. One alert per UTC day enforced by
# the private R2 marker. Owner must confirm receipt before switching to daily.
[triggers]
crons = ["*/5 * * * *"]

[vars]
WATCHDOG_TEST_MODE = "true"

[[r2_buckets]]
binding = "PRIVATE_BACKUPS"
bucket_name = "baylor-emba-private-backups"
