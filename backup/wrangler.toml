# Private owner-only backup service, SEPARATE from public proposal intake.
name = "baylor-emba-daily-backup"
main = "src/index.mjs"
compatibility_date = "2026-10-10"
workers_dev = false
preview_urls = false

[vars]
ACCOUNT_ID = "12c698318f2aa46859c28674feb4a0b8"
DATABASE_ID = "45080b4f-fb83-4b04-ad93-5fba0c73a203"
REPO_FULL_NAME = "martinperrinemp/baylor-emba-hub"

[[r2_buckets]]
binding = "PRIVATE_BACKUPS"
bucket_name = "baylor-emba-private-backups"

[[workflows]]
name = "baylor-emba-backup-workflow"
binding = "DAILY_BACKUP"
class_name = "DailyBackupWorkflow"
# Daily owner-only snapshot at 09:00 UTC (04:00 CDT / 03:00 CST).
# Cloudflare Workflows supports non-empty schedules directly on this binding.
# Owner verified full manual backup plus isolated D1 schema and GitHub ZIP recovery.
schedules = ["0 9 * * *"]
