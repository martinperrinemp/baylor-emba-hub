# Public repository configuration for Cloudflare Git builds.
# This deploys a safe, read-only/paused service until the database,
# submission secrets, and independently verified backups are in place.
name = "baylor-emba-proposals"
main = "src/index.mjs"
compatibility_date = "2026-10-10"

[vars]
INTAKE_ENABLED = "false"

# D1 is the private pending-proposals queue. This UUID is an identifier, not a secret.
[[d1_databases]]
binding = "DB"
database_name = "baylor-emba-proposals"
database_id = "45080b4f-fb83-4b04-ad93-5fba0c73a203"
migrations_dir = "migrations"
